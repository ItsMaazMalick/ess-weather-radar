<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weather & Radar — Pakistan Live Radar & Satellite</title>
  
  <!-- Google Fonts: Poppins & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body class="wr-body">

  <div id="app-container" class="wr-app-viewport">
    
    <!-- Full-Screen Interactive Leaflet Map -->
    <div id="map" class="wr-map-fullscreen"></div>

    <!-- Top Navigation Bar (ESS Weather & Flood Intelligence) -->
    <header class="wr-top-bar">
      <div class="wr-top-left-group">
        <button id="locate-me-btn" class="wr-circle-btn" title="My Location / GPS">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
        <button id="search-toggle-btn" class="wr-circle-btn" title="Search Any Location / City / Sector">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button id="theme-toggle-btn" class="wr-pill-toggle-btn" title="Day / Night / Auto Sun Mode">
          <i class="fa-solid fa-sun" id="theme-icon"></i>
          <span id="theme-label">Day</span>
        </button>
      </div>

      <!-- Center Logo & Title Pill -->
      <div class="wr-brand-pill" title="ESS Weather & Flood Intelligence">
        <div class="wr-brand-header-text">
          <div class="wr-brand-main"><span class="wr-brand-accent">ESS</span> <span class="wr-brand-white">Weather & Flood Intelligence</span></div>
          <div class="wr-brand-sub">Observe → Predict → Assess Impact → Act</div>
        </div>
      </div>

      <div class="wr-top-right-group">
        <button id="pmd-radar-toggle-btn" class="wr-pill-toggle-btn active" title="PMD Doppler Radar Coverage Cones (Islamabad, Lahore, Karachi)">
          <i class="fa-solid fa-tower-broadcast"></i>
          <span>PMD Cones</span>
        </button>
        <button id="copy-share-btn" class="wr-circle-btn" title="Share Link">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
        <button id="info-btn" class="wr-circle-btn" title="National Situation & Intelligence Dashboard">
          <i class="fa-solid fa-chart-line"></i>
        </button>
      </div>
    </header>

    <!-- 5 Analytical Modes Navigation Bar -->
    <nav class="ess-mode-switcher-bar">
      <button class="ess-mode-btn active" data-mode="weather">
        <i class="fa-solid fa-cloud-sun"></i>
        <span>A. WEATHER</span>
      </button>
      <button class="ess-mode-btn" data-mode="rainfall">
        <i class="fa-solid fa-cloud-showers-water"></i>
        <span>B. RAINFALL</span>
      </button>
      <button class="ess-mode-btn" data-mode="flood">
        <i class="fa-solid fa-water"></i>
        <span>C. FLOOD</span>
      </button>
      <button class="ess-mode-btn" data-mode="impact">
        <i class="fa-solid fa-users-viewfinder"></i>
        <span>D. IMPACT</span>
      </button>
      <button class="ess-mode-btn" data-mode="advisory">
        <i class="fa-solid fa-shield-halved"></i>
        <span>E. ADVISORY</span>
      </button>
      <button id="check-my-location-btn" class="ess-check-loc-btn" title="Inspect instant risk, rainfall & advice for your exact location">
        <i class="fa-solid fa-crosshairs"></i>
        <span>📍 CHECK MY LOCATION</span>
      </button>
    </nav>

    <!-- Floating Location Search Overlay -->
    <div id="search-container" class="wr-search-overlay hidden">
      <div class="wr-search-box">
        <i class="fa-solid fa-magnifying-glass wr-search-icon"></i>
        <input type="text" id="search-input" placeholder="Search exact city, sector, or area (e.g. Rawat, Gulberg, F-10)..." autocomplete="off">
        <button id="close-search-btn" class="wr-search-close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="search-results-list" class="wr-search-results hidden"></div>
    </div>

    <!-- Right-Side Vertical Layer Toolbar (Earth Scan Systems Action Icons) -->
    <aside class="wr-vertical-toolbar">
      <button class="wr-layer-action-btn active" data-layer="composite" title="Radar & Satellite Clouds">
        <i class="fa-solid fa-cloud-sun-rain"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="radar" title="Rain Doppler Radar">
        <i class="fa-solid fa-cloud-showers-heavy"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="rainfall_accum" title="Rainfall Accumulation (1h/6h/24h/72h)">
        <i class="fa-solid fa-chart-column"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="blockages" title="Road Blockages & Landslides (NHA / NDMA)">
        <i class="fa-solid fa-road-barrier"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="floods" title="Flood Inundation & Submerged Highways">
        <i class="fa-solid fa-water"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="rivers" title="River Intelligence & Gauging Stations">
        <i class="fa-solid fa-route"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="dams" title="Reservoir & Dam Water Storage">
        <i class="fa-solid fa-warehouse"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="agriculture" title="Agricultural Crop Exposure (Rice, Cotton, Maize)">
        <i class="fa-solid fa-wheat-awn"></i>
      </button>
      <button class="wr-layer-action-btn" data-layer="lightning" title="Lightning & Storms">
        <i class="fa-solid fa-bolt"></i>
      </button>
      <button id="snapshot-btn" class="wr-layer-action-btn wr-camera-btn" title="Export Animated GIF / Snapshot">
        <i class="fa-solid fa-camera"></i>
      </button>
    </aside>

    <!-- Zoom Earth Style Live Cursor Precipitation Probe -->
    <div id="hover-probe-tooltip" class="wr-hover-probe-pill hidden"></div>

    <!-- Floating Comprehensive Decision Intelligence Drawer -->
    <div id="info-drawer" class="wr-info-drawer hidden">
      <div class="wr-drawer-header">
        <div class="wr-drawer-title"><i class="fa-solid fa-shield-halved"></i> ESS Decision Intelligence Dashboard</div>
        <button id="close-info-drawer-btn" class="wr-close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="wr-drawer-body" id="info-drawer-content">
        <!-- Content dynamically populated by updateIntelligenceDashboard() -->
      </div>
    </div>

    <!-- Bottom Floating Time & Loop Controller Dock -->
    <footer class="wr-bottom-dock">
      <!-- 15 min / 30 min Interval Toggle -->
      <div class="wr-interval-strip">
        <button class="wr-interval-pill active" id="interval-15">15 min</button>
        <button class="wr-interval-pill" id="interval-30">30 min</button>
      </div>

      <!-- Time Slider Row with 'NOW' Separation -->
      <div class="wr-slider-row">
        <span class="wr-time-readout" id="current-frame-time-pkt">1:10 pm</span>
        <div class="wr-track-container">
          <div class="wr-track-progress" id="timeline-progress-fill"></div>
          <div class="wr-now-marker" id="timeline-now-marker"><span>NOW</span></div>
          <input type="range" id="timeline-slider" min="0" max="11" value="11" step="1" class="wr-slider-input">
        </div>
        <button id="play-pause-btn" class="wr-play-circle-btn" title="Play / Pause">
          <i class="fa-solid fa-play" id="play-icon"></i>
        </button>
        <button id="speed-toggle-btn" class="wr-speed-pill" title="Playback Speed">1x</button>
      </div>

      <!-- AccuWeather / MSN Meteorological Legend Bar -->
      <div class="wr-meteorological-legend">
        <div class="wr-leg-group">
          <span class="wr-leg-label">Rain (dBZ)</span>
          <div class="wr-leg-bar rain-bar"></div>
          <div class="wr-leg-steps">
            <span>Light (15)</span>
            <span>Mod (30)</span>
            <span>Heavy (45)</span>
            <span>Severe (60+)</span>
          </div>
        </div>
        <div class="wr-leg-types">
          <span class="type-pill rain">🌧️ Rain</span>
          <span class="type-pill snow">❄️ Snow</span>
          <span class="type-pill ice">🧊 Ice</span>
          <span class="type-pill mix">🟣 Mix</span>
        </div>
      </div>

      <!-- Bottom Date Strip -->
      <div class="wr-date-strip">
        <button class="wr-date-pill" id="btn-24h">- 24 hrs</button>
        <button class="wr-date-pill active" id="btn-now">now</button>
        <button class="wr-date-pill" id="btn-today">today</button>
        <button class="wr-date-pill" id="btn-tomorrow">tomorrow</button>
        <button class="wr-date-pill" id="btn-thu">Thu</button>
        <button class="wr-date-pill" id="btn-fri">Fri</button>
      </div>
    </footer>

    <!-- Animated GIF Export Modal -->
    <div id="snapshot-modal" class="modal-backdrop hidden">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3><i class="fa-solid fa-film"></i> Export Weather & Radar Animated GIF</h3>
          <button id="close-snapshot-modal-btn" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <div class="snapshot-preview-box" id="snapshot-preview-box">
            <div class="snapshot-loading-spinner" id="gif-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Rendering real-time animated GIF...</div>
            <img id="snapshot-preview-img" class="snapshot-img hidden" alt="Live Animated Weather GIF">
          </div>
          <div class="export-options-grid">
            <button id="download-gif-btn" class="export-btn primary-export"><i class="fa-solid fa-download"></i> Download Animated GIF</button>
            <button id="copy-share-btn-modal" class="export-btn"><i class="fa-solid fa-link"></i> Copy Link</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Main Application Script -->
  <script src="app.js?v=4.0"></script>
</body>
</html>
